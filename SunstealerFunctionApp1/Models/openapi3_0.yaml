          format: int32
        text1:
          maxLength: 64
          minLength: 1
          type: string
          description: '<i>description</i>: Text1 description'
          unique: false
          myint: 667
          mystring: Sunstealer
      example:
        - UUID: 1
          Encrypted1: DecryptedText
